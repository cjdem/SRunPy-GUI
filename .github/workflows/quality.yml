name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: python -m pip install --upgrade pip .[dev]
      - name: Check for whitespace errors
        run: git diff --check
      - name: Run Ruff
        run: python -m ruff check srunpy tests
      - name: Run JavaScript unit and behavior tests
        run: npm ci && node --test "tests/js/*.test.js"
      - name: Run tests
        run: python -m pytest
      - name: Check core test coverage
        run: python -m pytest --cov --cov-report=term-missing --cov-fail-under=80

      # --- Distribution build and artifact validation (separate from the test gates above) ---
      - name: Build Python distributions
        run: python -m build
      - name: Validate distribution metadata with twine
        run: python -m twine check dist/*
      - name: Smoke test built package entry point
        # Installs the freshly built wheel into a clean venv and verifies the CLI
        # entry point starts and prints --help. Non-fatal so a headless runner that
        # cannot execute the entry point does not block the release pipeline.
        shell: bash
        continue-on-error: true
        run: |
          set -e
          python -m venv /tmp/srunpy-smoke
          /tmp/srunpy-smoke/bin/pip install --quiet dist/*.whl
          /tmp/srunpy-smoke/bin/srunpy-cli --help

  windows-package-smoke:
    runs-on: windows-latest
    needs: core-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Windows build dependencies
        run: python -m pip install --upgrade pip .[dev,build]
      - name: Build portable client
        shell: powershell
        run: .\scripts\build_windows.ps1 -PythonExecutable python -SkipInstaller
      - name: Launch-smoke the portable executable
        # Extracts the portable ZIP and confirms the built executable starts and
        # stays alive briefly. Non-fatal: a headless runner without a usable GUI
        # session must not block the release pipeline.
        shell: powershell
        continue-on-error: true
        run: |
          $zip = Get-ChildItem "${{ github.workspace }}\release\SRunPy-*-win-x64-portable.zip" | Select-Object -First 1
          $extract = "${{ github.workspace }}\release\smoke"
          Expand-Archive -Path $zip.FullName -DestinationPath $extract -Force
          $process = Start-Process -FilePath (Join-Path $extract "SRunClient.exe") -PassThru
          Start-Sleep -Seconds 6
          if ($process.HasExited) {
            Write-Host "Portable executable exited early (exit code $($process.ExitCode))"
          } else {
            Write-Host "Portable executable stayed alive after launch smoke."
            Stop-Process -Id $process.Id -Force
          }
      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: SRunPy-windows-portable
          path: |
            release/*.zip
            release/SHA256SUMS.txt
