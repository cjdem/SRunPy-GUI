name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: python -m pip install --upgrade pip .[dev]
      - name: Run Ruff
        run: python -m ruff check srunpy tests
      - name: Run tests
        run: python -m pytest
      - name: Build Python distributions
        run: python -m build

  windows-package-smoke:
    runs-on: windows-latest
    needs: core-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Windows build dependencies
        run: python -m pip install --upgrade pip .[dev,build]
      - name: Build portable client
        shell: powershell
        run: .\scripts\build_windows.ps1 -PythonExecutable python -SkipInstaller
      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: SRunPy-windows-portable
          path: |
            release/*.zip
            release/SHA256SUMS.txt
